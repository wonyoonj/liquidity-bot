name: Daily Top 4 Headlines (Reuters)

on:
  schedule:
    # Runs once a day, EVERY day, independent of daily_post.yml's 7-day
    # rotation and daily_news.yml's single-story picker. 13:50 UTC is
    # ~9:50am ET during EDT / ~8:50am ET during EST — after the US market
    # open, deliberately offset 15 minutes from daily_news.yml's 13:35 UTC
    # slot so the two workflows never contend for the same git-push window.
    - cron: '50 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the bot can commit the summary card image + the dedup state file

jobs:
  top4:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily top 4 headlines script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}       # "gemini" or "openai" — REQUIRED for this feature
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python daily_top4.py

      - name: Upload generated card (debugging, 7-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top4-card
          path: output/top4_card.png
          retention-days: 7
          if-no-files-found: ignore
